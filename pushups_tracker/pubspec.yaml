name: pushups_tracker
description: A tracker for the One Hundred Pushups program
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Database (Drift)
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.5.24

  # Notifications & alarms
  flutter_local_notifications: ^17.2.3

  # Utilities
  wakelock_plus: ^1.2.8
  vibration: ^3.2.1
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # UI
  cupertino_icons: ^1.0.8

  # Timezone support for notifications
  timezone: ^0.9.4
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/program_v1.json
